<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lilly Person Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#121212;color:#eee;height:100vh;display:flex;flex-direction:row;overflow:hidden}
  #side{width:330px;background:#1e1e1e;padding:12px;overflow-y:auto;border-right:1px solid #333;flex-shrink:0}
  #map{flex:1;height:100%}
  h2{margin:0 0 8px;font-size:1.1rem;color:#9f7bd6;letter-spacing:.3px}
  .stat{background:#2a2a2a;border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:.76rem;margin-bottom:8px}
  .stat b{color:#ccc}
  .btn{width:100%;padding:9px;border:none;border-radius:8px;background:#7b5ea7;color:#fff;font-weight:700;cursor:pointer;font-size:.8rem;margin-bottom:8px}
  #feed{display:flex;flex-direction:column;gap:6px}
  .card{background:#2a2a2a;border:1px solid #333;border-left:3px solid #9f7bd6;border-radius:8px;padding:8px 10px;font-size:.76rem}
  .card.trail{display:none}
  .card .nm{font-weight:700;color:#fff;font-size:.8rem}
  .tb{font-size:.62rem;background:#444;color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px}
  @media (max-width:820px){body{flex-direction:column-reverse}#side{width:100%;height:46vh;border-right:none;border-top:1px solid #333}#map{height:54vh}}
</style>
</head>
<body>
  <div id="side">
    <h2>🧭 Lilly Person Tracker</h2>
    <button class="btn" onclick="rescan()">⚡ Force BLE/WiFi Scan</button>
    <div class="stat">
      <div><b>Fleet:</b> <span id="fleet">…</span></div>
      <div><b>People:</b> <span id="people">…</span></div>
      <div><b>Sightings:</b> <span id="sights">…</span></div>
    </div>
    <div id="feed"><div style="color:#999;text-align:center;padding:16px">Loading…</div></div>
  </div>
  <div id="map"></div>

<script>
let map, famMarkers={}, trailLines={}, nodeMarkers={};
function init(){
  map=L.map('map',{zoomControl:false}).setView([45,-75],13);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  load(); setInterval(load,6000);
}
async function rescan(){
  document.getElementById('fleet').innerText='Scanning…';
  try{ await fetch('/api/tracker/scan'); }catch(e){}
  load();
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function load(){
  let d;
  try{ d=await (await fetch('/api/tracker/map')).json(); }
  catch(e){ document.getElementById('feed').innerHTML='<div style="color:#e57373;text-align:center">Failed</div>'; return; }
  const loc=d.location||{};
  document.getElementById('fleet').innerText=(d.nodes||[]).filter(n=>n.online).length+' of '+(d.nodes||[]).length+' online';
  document.getElementById('people').innerText=d.people_count||0;
  document.getElementById('sights').innerText=d.sightings_count||0;
  // fleet home marker
  if(d.nodes&&d.nodes.length){
    let first=null;
    (d.nodes||[]).forEach(n=>{
      if(!n.lat&&!n.lng){ if(nodeMarkers[n.node_id]){nodeMarkers[n.node_id].remove();delete nodeMarkers[n.node_id];} return; }
      const col=hash(n.node_id);
      if(nodeMarkers[n.node_id]) nodeMarkers[n.node_id].setLatLng([n.lat,n.lng]).setStyle({color:col,fillColor:col});
      else { nodeMarkers[n.node_id]=L.circleMarker([n.lat,n.lng],{radius:8,color:'#fff',weight:2,fillColor:col,fillOpacity:.85}).addTo(map).bindPopup('<b>'+esc(n.name)+'</b><br>🟢 '+(n.online?'online':'offline')+' · 🔋'+Math.round(n.battery||0)+'%'); if(!first)first=[n.lat,n.lng]; }
    });
    if(first) map.setView(first,14);
  }
  // trails
  Object.keys(trailLines).forEach(k=>{ trailLines[k].remove(); });
  trailLines={};
  const trails=d.trails||{};
  Object.keys(trails).forEach(p=>{
    const pts=trails[p].filter(pt=>pt&&pt.lat&&pt.lng);
    if(pts.length<2) return;
    trailLines[p]=L.polyline(pts.map(pt=>[pt.lat,pt.lng]),{color:hash(p),weight:3,opacity:.65,dashArray:'5,5'}).addTo(map);
  });
  // individuals
  const seen=Object.keys(trails).filter(p=>(trails[p]||[]).some(pt=>pt&&pt.lat&&pt.lng));
  if(!seen.length){
    document.getElementById('feed').innerHTML='<div style="color:#999;text-align:center;padding:12px">No moving tracks yet — run a scan and walk around.</div>';
  } else {
    let html='';
    seen.forEach(p=>{
      const pts=trails[p].filter(pt=>pt&&pt.lat&&pt.lng);
      const last=pts[pts.length-1];
      html+='<div class="card"><span class="nm" style="color:'+hash(p)+'">'+esc(p)+'</span><span class="tb">'+pts.length+' ping'+(pts.length>1?'s':'')+'</span><div style="color:#aaa;margin-top:3px">'+last.lat.toFixed(5)+', '+last.lng.toFixed(5)+'</div></div>';
      famMarkers[p]=L.circleMarker([last.lat,last.lng],{radius:6,color:'#fff',weight:1.5,fillColor:hash(p),fillOpacity:.9}).addTo(map).bindPopup('<b>'+esc(p)+'</b><br>'+last.lat.toFixed(5)+', '+last.lng.toFixed(5));
    });
    Object.keys(famMarkers).forEach(p=>{ if(!seen.includes(p)){ famMarkers[p].remove(); delete famMarkers[p]; } });
    document.getElementById('feed').innerHTML=html;
  }
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return 'hsl('+(Math.abs(h)%360)+',60%,62%)';}
init();
</script>
</body>
</html>
