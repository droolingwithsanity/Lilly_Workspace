# Lilly AI — unified entry point.
#
# The canonical, portable compose lives in lilly-app/docker-compose.yml.
# This file simply includes it, so existing scripts keep working with:
#     docker compose up -d
# The whole lilly-app/ folder can be copied to another machine and run
# standalone (see lilly-app/README.md).
name: lilly
include:
  - lilly-app/docker-compose.yml