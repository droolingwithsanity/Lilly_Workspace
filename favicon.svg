<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Screen grab / device frame style -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#1a1a2e"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#16213e"/>
  
  <!-- Pup face centered in screen -->
  <circle cx="32" cy="28" r="14" fill="#f0e6ef"/>
  
  <!-- Ears -->
  <ellipse cx="20" cy="22" rx="6" ry="9" fill="#8b7a9e" transform="rotate(-15 20 22)"/>
  <ellipse cx="44" cy="22" rx="6" ry="9" fill="#8b7a9e" transform="rotate(15 44 22)"/>
  
  <!-- Inner ears -->
  <ellipse cx="20" cy="22" rx="3" ry="6" fill="#d4c8e0" transform="rotate(-15 20 22)"/>
  <ellipse cx="44" cy="22" rx="3" ry="6" fill="#d4c8e0" transform="rotate(15 44 22)"/>
  
  <!-- Eyes -->
  <circle cx="26" cy="27" r="2.5" fill="#5d4e6d"/>
  <circle cx="38" cy="27" r="2.5" fill="#5d4e6d"/>
  <circle cx="27" cy="26" r="0.8" fill="#fff"/>
  <circle cx="39" cy="26" r="0.8" fill="#fff"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="32" rx="3" ry="2.5" fill="#5d4e6d"/>
  
  <!-- Mouth -->
  <path d="M29 35 Q32 37 35 35" stroke="#5d4e6d" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Blush -->
  <circle cx="22" cy="32" r="2.5" fill="#e8c8d8" opacity="0.6"/>
  <circle cx="42" cy="32" r="2.5" fill="#e8c8d8" opacity="0.6"/>
  
  <!-- Screen glare -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#glare)" opacity="0.1"/>
  <defs>
    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
