<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Lilly Skills Market</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0e6ef;--surface:#fff;--surface2:#f8f5fa;
  --border:#e0d4e8;--text:#5d4e6d;--text2:#8b7a9e;
  --accent:#8b7a9e;--accent2:#a892b8;--accent-dim:rgba(139,122,158,0.12);
  --ok:#4caf50;--err:#e55;--warn:#ff9800;
  --radius:14px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
body{display:flex;flex-direction:column}

.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:10;
}
.header-left{display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8b7a9e,#a892b8);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
  box-shadow:0 2px 8px rgba(139,122,158,0.25);
}
.title-area{}
.title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.sub{font-size:11px;color:var(--text2);margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
.pill{
  font-size:10px;padding:5px 12px;border-radius:20px;font-weight:600;
  letter-spacing:0.4px;text-transform:uppercase;white-space:nowrap;
}
.pill.local{background:rgba(76,175,80,0.12);color:#2e7d32}
.pill.catalog{background:var(--accent-dim);color:var(--accent)}
.pill.err{background:rgba(239,68,68,0.12);color:var(--err)}

.toolbar{
  display:flex;gap:10px;padding:12px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.search{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 16px;color:var(--text);
  font-size:14px;outline:none;transition:border-color .2s;
}
.search:focus{border-color:var(--accent2)}
.filter-row{display:flex;gap:6px;align-items:center}
.filter-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:20px;
  padding:6px 14px;color:var(--text2);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-btn:active{opacity:0.85}

.list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.list::-webkit-scrollbar{width:5px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.empty{
  color:var(--text2);text-align:center;margin-top:50px;font-size:13px;
  line-height:1.6;
}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.6}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;
}
.card:active{border-color:var(--accent2);transform:scale(0.985)}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#8b7a9e,#a892b8);opacity:0;transition:opacity .15s;
}
.card:hover::before{opacity:1}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.card-id{font-size:10px;color:var(--text2);margin-top:3px;font-family:ui-monospace,Consolas,monospace}
.card-desc{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{
  font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500;
  background:var(--accent-dim);color:var(--accent);
}
.source-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.source-dot.builtin{background:#4caf50}
.source-dot.catalog{background:#2196f3}
.source-dot.openlive{background:#ff9800}

.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-back.show{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
}
.modal h2{font-size:18px;margin-bottom:4px;color:var(--text)}
.modal .m-id{font-size:11px;color:var(--text2);margin-bottom:14px;font-family:ui-monospace,Consolas,monospace}
.modal .m-desc{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:14px}
.modal .m-section{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:6px}
.modal .m-row{font-size:12px;color:var(--text);margin-top:6px;line-height:1.5}
.modal .m-row b{color:var(--accent)}
.modal .m-code{
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:12px;font-size:12px;font-family:ui-monospace,Consolas,monospace;
  color:var(--text);margin-top:8px;white-space:pre-wrap;word-break:break-word;
}
.modal-close{
  display:block;margin-top:20px;width:100%;background:var(--accent);
  border:none;border-radius:var(--radius);padding:12px;color:#fff;
  font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
.modal-close:active{opacity:0.85}
.modal-back-btn{
  display:inline-block;margin-bottom:14px;background:none;border:none;
  color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:10px 22px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:60;max-width:92vw;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
}
.toast.show{opacity:1}

.skill-actions{display:flex;gap:8px;margin-top:14px}
.btn{
  flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;
  font-weight:600;cursor:pointer;transition:opacity .15s;text-align:center;
}
.btn:active{opacity:0.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">🐾</div>
    <div class="title-area">
      <div class="title">Lilly Skills Market</div>
      <div class="sub" id="subLine">loading skills...</div>
    </div>
  </div>
  <div class="header-right">
    <div class="pill local" id="localCount">0 built-in</div>
    <div class="pill catalog" id="catalogCount">0 catalog</div>
    <button class="btn btn-secondary" id="guideBtn" style="padding:6px 14px;font-size:11px;border-radius:20px;margin-left:8px">📖 Guide</button>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search" class="search" placeholder="search skills by name, tag or description...">
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">all</button>
    <button class="filter-btn" data-filter="builtin">built-in</button>
    <button class="filter-btn" data-filter="catalog">catalog</button>
  </div>
</div>

<div class="list" id="list"></div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal"></div>
</div>

<!-- Skills Guide Panel -->
<div class="modal-back" id="guideBack" style="display:none">
  <div class="modal" style="max-width:640px">
    <button class="modal-back-btn" onclick="closeGuide()">← back to skills</button>
    <h2>📖 Skills Guide</h2>
    <div class="m-id">Frontend skills · functions · expectations · known issues</div>
    <div id="guideContent" style="font-size:13px;line-height:1.7;color:var(--text)"></div>
    <div id="guideCelebration" style="display:none;text-align:center;padding:20px;margin-top:10px">
      <div style="font-size:48px;margin-bottom:10px">🎉</div>
      <div style="font-size:18px;font-weight:700;color:var(--accent)">You did this, Welldone!</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">You're now a Lilly Skills expert</div>
    </div>
    <button class="modal-close" onclick="markGuideComplete()">Mark as read</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVER = location.origin;
const $ = id => document.getElementById(id);
const listEl = $('list');
const statusEl = $('subLine');
const localCountEl = $('localCount');
const catalogCountEl = $('catalogCount');

let allSkills = [];
let localSkills = [];
let catalogSkills = [];
let currentFilter = 'all';

function setStatus(s){ statusEl.textContent = s; }

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getSourceLabel(skill){
  if(skill.source === 'openhuman' || skill.source === 'catalog') return 'catalog';
  if(skill.source === 'openlive') return 'openlive';
  return 'builtin';
}

function getSourceClass(source){
  if(source === 'catalog' || source === 'openhuman') return 'catalog';
  if(source === 'openlive') return 'openlive';
  return 'builtin';
}

async function loadLocalSkills(){
  try{
    const r = await fetch(SERVER + '/api/lilly_skills?limit=200', {cache:'no-store'});
    if(!r.ok) return [];
    const j = await r.json();
    const skills = (j.skills || []).map(s => ({
      id: s.id || s.name || s.key || 'unknown',
      name: s.name || s.label || s.id || 'Unknown',
      description: s.description || s.canned_reply || 'No description available.',
      source: 'builtin',
      source_label: 'built-in',
      tags: s.tags || s.aliases || [],
      category: s.category || 'general',
      aliases: s.aliases || [],
      commands: s.commands || s.actions || {},
      installed: true,
    }));
    return skills;
  }catch(e){ return []; }
}

async function loadCatalogSkills(){
  try{
    const r = await fetch(SERVER + '/api/openhuman/catalog?limit=200', {cache:'no-store'});
    if(!r.ok) return [];
    const j = await r.json();
    return (j.entries || []).map(e => ({
      id: e.id || e.name || 'unknown',
      name: e.name || 'Unknown',
      description: e.description || 'No description available.',
      source: 'catalog',
      source_label: 'catalog',
      tags: e.tags || [],
      category: e.category || 'general',
      aliases: [],
      commands: e.commands || e.actions || {},
      installed: false,
      entry: e,
    }));
  }catch(e){ return []; }
}

async function loadAllSkills(){
  listEl.innerHTML = '<div class="empty"><div class="empty-icon">🐾</div>loading skills...</div>';
  setStatus('loading...');

  const [local, catalog] = await Promise.all([
    loadLocalSkills(),
    loadCatalogSkills(),
  ]);

  localSkills = local;
  catalogSkills = catalog;
  allSkills = [...local, ...catalog];

  localCountEl.textContent = local.length + ' built-in';
  catalogCountEl.textContent = catalog.length + ' catalog';

  const total = allSkills.length;
  if(total === 0){
    setStatus('no skills found');
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">🐾</div>no skills available yet.<br>try syncing the catalog or check your local skills.</div>';
  }else{
    setStatus(total + ' skill' + (total !== 1 ? 's' : '') + ' available');
    renderList();
  }
}

function renderList(){
  const q = $('search').value.trim().toLowerCase();
  let filtered = allSkills;

  if(currentFilter !== 'all'){
    filtered = filtered.filter(s => getSourceLabel(s) === currentFilter);
  }

  if(q){
    filtered = filtered.filter(s => {
      const blob = (s.name + ' ' + s.id + ' ' + (s.description||'') + ' ' + (s.tags||[]).join(' ')).toLowerCase();
      return blob.indexOf(q) !== -1;
    });
  }

  if(!filtered.length){
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>no skills match your search</div>';
    return;
  }

  listEl.innerHTML = filtered.map(s => {
    const tags = (s.tags || []).slice(0, 5);
    const srcClass = getSourceClass(s.source);
    const keyBadge = s.requires_api_key ? '<span style="font-size:10px;margin-left:4px" title="Requires API key">🔑</span>' : '';
    return '<div class="card" onclick="openDetail(\'' + esc(s.id) + '\')">'
      + '<div class="card-top"><div><div class="card-name">' + esc(s.name) + keyBadge + '</div>'
      + '<div class="card-id">' + esc(s.id) + '</div></div>'
      + '<div class="source-dot ' + srcClass + '" title="' + esc(s.source_label) + '"></div></div>'
      + '<div class="card-desc">' + esc(s.description || '') + '</div>'
      + '<div class="card-meta">'
      + '<span class="tag">' + esc(s.source_label) + '</span>'
      + (s.category ? '<span class="tag">' + esc(s.category) + '</span>' : '')
      + (tags.length ? tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') : '')
      + '</div></div>';
  }).join('');
}

async function openDetail(id){
  const skill = allSkills.find(s => s.id === id);
  if(!skill){ toast('skill not found'); return; }

  const modal = $('modal');
  modal.innerHTML = '<h2>loading...</h2>';
  $('modalBack').classList.add('show');

  let detail = skill;
  if(skill.entry && skill.source === 'catalog'){
    try{
      const r = await fetch(SERVER + '/api/openhuman/skills/' + encodeURIComponent(id), {cache:'no-store'});
      if(r.ok){
        const j = await r.json();
        detail = j.skill || j.entry || skill.entry;
      }
    }catch(e){}
  }

  const tags = (detail.tags || []).slice(0, 10);
  const aliases = detail.aliases || [];
  const commands = detail.commands || detail.actions || {};
  const steps = Object.keys(commands).length;

  let html = '<button class="modal-back-btn" onclick="closeModal()">← back to skills</button>';
  html += '<h2>' + esc(detail.name || detail.id) + '</h2>';
  html += '<div class="m-id">' + esc(detail.id || '') + ' · ' + esc(detail.source_label || detail.source || 'local') + '</div>';
  html += '<div class="m-desc">' + esc(detail.description || 'no description available.') + '</div>';

  if(tags.length){
    html += '<div class="m-section">tags</div>';
    html += '<div class="card-meta" style="margin-top:0">' + tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
  }

  if(aliases.length){
    html += '<div class="m-section">also known as</div>';
    html += '<div class="m-row">' + esc(aliases.slice(0, 10).join(', ')) + '</div>';
  }

  if(steps > 0){
    html += '<div class="m-section">commands (' + steps + ')</div>';
    html += '<div class="m-code">' + esc(JSON.stringify(commands, null, 2)) + '</div>';
  }

  if(detail.package){
    html += '<div class="m-row"><b>package:</b> ' + esc(detail.package) + '</div>';
  }
  if(detail.version){
    html += '<div class="m-row"><b>version:</b> ' + esc(detail.version) + '</div>';
  }
  if(detail.author){
    html += '<div class="m-row"><b>author:</b> ' + esc(detail.author) + '</div>';
  }
  if(detail.docs_path){
    html += '<div class="m-row"><b>docs:</b> ' + esc(detail.docs_path) + '</div>';
  }

  // Show API key requirement if applicable
  if(detail.requires_api_key){
    html += '<div class="m-section" style="color:#f87171">⚠️ requires API key</div>';
    html += '<div class="m-row">' + esc(detail.api_key_help || 'Contact admin for API key') + '</div>';
    html += '<div class="m-row" style="font-size:10px;color:var(--text-tertiary)">Key stored server-side as: ' + esc(detail.api_key_env || '') + '</div>';
  }

  html += '<div class="skill-actions">';
  html += '<button class="btn btn-primary" onclick="toast(\'skill info copied!\');navigator.clipboard.writeText(\'' + esc(skill.id) + '\').catch(()=>{})">copy skill id</button>';
  html += '<button class="btn btn-secondary" onclick="showSkillWiki(\'' + esc(skill.id) + '\')">📖 wiki</button>';
  if(detail.requires_api_key){
    html += '<button class="btn btn-secondary" onclick="showApiKeyConfig(\'' + esc(skill.id) + '\', \'' + esc(detail.api_key_env || '') + '\')">🔑 api key</button>';
  }
  html += '<button class="btn btn-secondary" onclick="addToHamburger(\'' + esc(skill.id) + '\', \'' + esc(skill.name) + '\')">📌 hamburger</button>';
  html += '<button class="btn btn-secondary" onclick="addToRadial(\'' + esc(skill.id) + '\', \'' + esc(skill.name) + '\')">📱 radial</button>';
  html += '</div>';
  html += '<button class="modal-close" onclick="closeModal()">close</button>';

  modal.innerHTML = html;
}

function closeModal(){ $('modalBack').classList.remove('show'); }

async function showApiKeyConfig(skillId, envVar){
  const modal = $('modal');
  modal.innerHTML = '<h2>loading...</h2>';
  $('modalBack').classList.add('show');
  
  // Check current key status
  let hasKey = false;
  try{
    const r = await fetch(SERVER + '/api/skills/api_key?skill_id=' + encodeURIComponent(skillId));
    if(r.ok){
      const j = await r.json();
      hasKey = j.has_key;
    }
  }catch(e){}
  
  let html = '<button class="modal-back-btn" onclick="closeModal()">← back to skills</button>';
  html += '<h2>🔑 API Key Configuration</h2>';
  html += '<div class="m-id">' + esc(skillId) + ' · ' + esc(envVar) + '</div>';
  html += '<div class="m-desc">This skill requires an API key to function. The key is stored securely on the server and never exposed to the browser.</div>';
  
  html += '<div style="margin-top:16px">';
  html += '<label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:6px">API Key</label>';
  html += '<input type="password" id="apiKeyInput" placeholder="Enter your API key..." style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;box-sizing:border-box">';
  html += '</div>';
  
  html += '<div class="skill-actions" style="margin-top:14px">';
  html += '<button class="btn btn-primary" onclick="saveApiKey(\'' + esc(skillId) + '\', \'' + esc(envVar) + '\')">Save Key</button>';
  html += '<button class="btn btn-secondary" onclick="removeApiKey(\'' + esc(skillId) + '\')">Remove Key</button>';
  html += '</div>';
  
  if(hasKey){
    html += '<div style="margin-top:12px;padding:10px;background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:10px;font-size:11px;color:#2e7d32">✅ API key is configured</div>';
  }else{
    html += '<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;font-size:11px;color:#c62828">⚠️ No API key configured</div>';
  }
  
  html += '<button class="modal-close" onclick="closeModal()">close</button>';
  modal.innerHTML = html;
}

async function saveApiKey(skillId, envVar){
  const input = document.getElementById('apiKeyInput');
  if(!input) return;
  const key = input.value.trim();
  if(!key){
    toast('Please enter an API key');
    return;
  }
  try{
    const r = await fetch(SERVER + '/api/skills/api_key', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({skill_id: skillId, env_var: envVar, api_key: key})
    });
    const j = await r.json();
    if(j.ok){
      toast('API key saved for ' + skillId);
      showApiKeyConfig(skillId, envVar); // Refresh
    }else{
      toast('Failed: ' + (j.error || 'unknown'));
    }
  }catch(e){
    toast('Network error');
  }
}

async function removeApiKey(skillId){
  try{
    const r = await fetch(SERVER + '/api/skills/api_key?skill_id=' + encodeURIComponent(skillId), {
      method: 'DELETE',
      credentials: 'include'
    });
    const j = await r.json();
    if(j.ok){
      toast('API key removed for ' + skillId);
      showApiKeyConfig(skillId, ''); // Refresh
    }else{
      toast('Failed: ' + (j.error || 'unknown'));
    }
  }catch(e){
    toast('Network error');
  }
}

async function showSkillWiki(id){
  const skill = allSkills.find(s => s.id === id);
  if(!skill){ toast('skill not found'); return; }
  
  const modal = $('modal');
  modal.innerHTML = '<h2>loading...</h2>';
  $('modalBack').classList.add('show');
  
  // Try to get full detail from server
  let detail = skill;
  if(skill.entry && skill.source === 'catalog'){
    try{
      const r = await fetch(SERVER + '/api/openhuman/skills/' + encodeURIComponent(id), {cache:'no-store'});
      if(r.ok){ const j = await r.json(); detail = j.skill || j.entry || skill.entry; }
    }catch(e){}
  }
  
   const aliases = detail.aliases || [];
   const commands = detail.commands || detail.actions || {};
   const examples = [];
   for (const [key, val] of Object.entries(commands)) {
     if (typeof val === 'string') examples.push('"' + key + '" → ' + val);
     else if (typeof val === 'object' && val !== null) examples.push('"' + key + '" → ' + JSON.stringify(val));
   }
   
   // Use skill-level examples if commands don't provide any
   const skillExamples = detail.examples || [];
   const allExamples = examples.length ? examples : skillExamples;
   
   const parameters = detail.parameters || [];
   const navigation = detail.navigation || [];
   const wiki = detail.wiki || '';
   
   let html = '<button class="modal-back-btn" onclick="closeModal()">← back to skills</button>';
   html += '<h2>📖 ' + esc(detail.name || detail.id) + '</h2>';
   html += '<div class="m-id">' + esc(detail.id || '') + ' · wiki & usage</div>';
   html += '<div class="m-desc">' + esc(detail.description || 'no description available.') + '</div>';
   
   if(aliases.length){
     html += '<div class="m-section">aliases (say any of these)</div>';
     html += '<div class="m-row">' + esc(aliases.slice(0, 15).join(', ')) + '</div>';
   }
   
   if(allExamples.length){
     html += '<div class="m-section">example usage</div>';
     html += '<div class="m-code">' + esc(allExamples.slice(0, 8).join('\n')) + '</div>';
   }
   
   if(parameters.length){
     html += '<div class="m-section">parameters</div>';
     html += '<div class="m-row">' + esc(parameters.join(' · ')) + '</div>';
   }
   
   if(navigation.length){
     html += '<div class="m-section">navigation</div>';
     html += '<div class="m-row">' + esc(navigation.join(' · ')) + '</div>';
   }
   
   if(wiki){
     html += '<div class="m-section">wiki</div>';
     html += '<div class="m-row">' + esc(wiki) + '</div>';
   }
   
   if(detail.docs_path){
     html += '<div class="m-row"><b>docs:</b> ' + esc(detail.docs_path) + '</div>';
   }
  
  html += '<div class="skill-actions">';
  html += '<button class="btn btn-primary" onclick="addToHamburger(\'' + esc(skill.id) + '\', \'' + esc(skill.name) + '\')">📌 add to hamburger</button>';
  html += '<button class="btn btn-secondary" onclick="addToRadial(\'' + esc(skill.id) + '\', \'' + esc(skill.name) + '\')">📱 add to radial</button>';
  html += '</div>';
  html += '<button class="modal-close" onclick="closeModal()">close</button>';
  
  modal.innerHTML = html;
}

async function addToHamburger(id, name){
  try{
    const r = await fetch(SERVER + '/api/menu_shortcuts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: id, name: name, description: '', global: false, added_by: 'skills-market'})
    });
    const j = await r.json();
    if(j.ok || j.shortcuts){
      toast('added to hamburger: ' + name);
    }else{
      toast('failed: ' + (j.error || 'unknown'));
    }
  }catch(e){
    toast('network error');
  }
}

async function addToRadial(id, name){
  try{
    const r = await fetch(SERVER + '/api/radial_shortcuts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({skill_id: id, name: name})
    });
    const j = await r.json();
    if(j.ok){
      toast('added to radial: ' + name);
    }else{
      toast('failed: ' + (j.error || 'unknown'));
    }
  }catch(e){
    toast('network error');
  }
}

async function sync(){
  toast('syncing catalog...');
  try{
    const r = await fetch(SERVER + '/api/openhuman/refresh', {method:'POST', cache:'no-store'});
    if(!r.ok) throw new Error('sync failed: ' + r.status);
    const j = await r.json();
    toast('synced ' + (j.skills_merged || 0) + ' skills');
  }catch(e){
    toast('sync failed — bridge may be offline');
  }
  await loadAllSkills();
}

$('search').addEventListener('input', renderList);
$('modalBack').addEventListener('click', e => { if(e.target === $('modalBack')) closeModal(); });

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});

loadAllSkills();
</script>
