services:
  redis:
    image: redis:7-alpine
    container_name: lillyos_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-supernova_secret}"]
    volumes:
      - ./redis_data:/data
    networks:
      - lilly_net
    restart: always

  backend:
    build: ./backend
    container_name: lillyos_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-supernova_secret}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - lilly_net
    restart: always

  frontend:
    build: ./frontend
    container_name: lillyos_frontend
    ports:
      - "3006:80"
    environment:
      - VITE_API_URL=
    networks:
      - lilly_net
    restart: always

networks:
  lilly_net:
    driver: bridge
