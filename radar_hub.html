<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lilly Vision Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:#0d0a12;color:#e8e0f0}
canvas{display:block}
#hub{width:100%;height:100%;position:relative}
#mainCanvas{width:100%;height:100%}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:2}
#sidebar{position:absolute;top:16px;right:16px;width:260px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:14px;z-index:10;pointer-events:auto;max-height:calc(100vh - 32px);overflow-y:auto}
#sidebar h2{font-size:13px;font-weight:700;color:#a892b8;margin-bottom:10px;letter-spacing:0.5px;text-transform:uppercase}
.node-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);transition:all .3s}
.node-card:hover{background:rgba(255,255,255,0.1)}
.node-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.node-name{font-size:12px;font-weight:600;flex:1}
.node-status{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:700}
.node-on{background:rgba(105,240,174,0.15);color:#69f0ae}
.node-off{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.3)}
.detection-log{margin-top:10px;font-size:11px;color:rgba(255,255,255,0.4);max-height:120px;overflow-y:auto}
.detection-log div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.detection-log .det-name{color:#c084fc;font-weight:600}
.detection-log .det-time{color:rgba(255,255,255,0.25);font-size:10px}
#title{position:absolute;top:16px;left:16px;z-index:10;pointer-events:auto}
.title-row{display:flex;align-items:flex-start;gap:12px}
#title h1{font-size:18px;font-weight:700;color:#a892b8;text-shadow:0 0 20px rgba(168,146,184,0.3)}
#title p{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}
.win-controls{display:flex;gap:6px;margin-top:2px}
.win-controls button{width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#c084fc;font-size:15px;font-weight:700;line-height:1;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.win-controls button:hover{background:rgba(192,132,252,0.22);border-color:rgba(192,132,252,0.5);box-shadow:0 0 12px rgba(192,132,252,0.25)}
.win-controls .min-btn:hover{background:rgba(105,240,174,0.18);border-color:rgba(105,240,174,0.4);color:#69f0ae}
.win-controls .close-btn:hover{background:rgba(229,115,115,0.2);border-color:rgba(229,115,115,0.5);color:#e57373}
/* ── Minimized pill ── */
#minPill{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:auto;padding:10px 22px;border-radius:999px;border:1px solid rgba(192,132,252,0.4);background:rgba(29,23,38,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#e8e0f0;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 0 24px rgba(192,132,252,0.2);transition:all .25s}
#minPill:hover{background:rgba(192,132,252,0.2)}
/* ── Device card ── */
.device-card{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;margin-bottom:8px;background:linear-gradient(135deg,rgba(105,240,174,0.12),rgba(192,132,252,0.08));border:1px solid rgba(105,240,174,0.28)}
.device-card .node-name{color:#d7ffe9}
.section-title{margin-top:12px}
/* ── Voice button ── */
#voiceBtn{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(192,132,252,0.4);background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;box-shadow:0 0 20px rgba(192,132,252,0.15)}
#voiceBtn:hover{background:rgba(192,132,252,0.15);border-color:rgba(192,132,252,0.6);box-shadow:0 0 30px rgba(192,132,252,0.3)}
#voiceBtn.listening{background:rgba(192,132,252,0.25);border-color:#c084fc;animation:voicePulse 1.2s infinite}
#voiceBtn svg{width:28px;height:28px;fill:#c084fc;transition:fill .2s}
#voiceBtn.listening svg{fill:#e8b4f8}
@keyframes voicePulse{0%,100%{box-shadow:0 0 20px rgba(192,132,252,0.3)}50%{box-shadow:0 0 40px rgba(192,132,252,0.6)}}
/* ── Transcript bar ── */
#transcript{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;max-width:500px;width:90%;text-align:center;opacity:0;transition:opacity .3s}
#transcript.show{opacity:1}
#transcript .text{font-size:14px;color:#e8e0f0;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:10px 20px;display:inline-block}
#transcript .speaker{font-size:10px;color:#c084fc;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px}
/* ── Response bubble (Lilly speaks) ── */
#lillyResponse{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;max-width:520px;width:90%;text-align:center;opacity:0;transition:opacity .4s}
#lillyResponse.show{opacity:1}
#lillyResponse .text{font-size:13px;color:#e8e0f0;background:rgba(168,146,184,0.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(168,146,184,0.2);border-radius:14px;padding:10px 18px;display:inline-block;line-height:1.4}
#lillyResponse .speaker{font-size:10px;color:#69f0ae;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px}
</style>
</head>
<body>
<div id="hub">
  <canvas id="mainCanvas"></canvas>
  <div id="overlay"></div>
  <div id="title">
    <div class="title-row">
      <div>
        <h1>🐾 Lilly Vision Hub</h1>
        <p id="subtitle">3 nodes · live tracking</p>
      </div>
      <div class="win-controls">
        <button class="min-btn" onclick="minimizeHub()" title="Minimize">−</button>
        <button class="close-btn" onclick="closeHub()" title="Close">✕</button>
      </div>
    </div>
  </div>
  <div id="sidebar">
    <h2>🖥️ Device</h2>
    <div id="deviceCard"></div>
    <h2 class="section-title">📡 Phone Nodes</h2>
    <div id="nodeList"></div>
    <h2 class="section-title">👁️ Recent Detections</h2>
    <div id="detectionLog" class="detection-log"></div>
  </div>
  <div id="minPill" style="display:none" onclick="restoreHub()">🐾 Lilly Vision Hub — tap to expand</div>
  <!-- Voice control -->
  <div id="lillyResponse"><div class="speaker">Lilly</div><div class="text" id="lillyText"></div></div>
  <div id="transcript"><div class="speaker">You</div><div class="text" id="transcriptText"></div></div>
  <div id="voiceBtn" onclick="toggleVoice()">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Lilly Vision Hub — Canvas Avatar + Vision Sphere + Tracker + Nodes
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, t = 0;

// ── Theme colours ──
const COL = {
  bg: '#0d0a12',
  lavender: '#a892b8',
  purple: '#8b7a9e',
  lilac: '#c084fc',
  mint: '#69f0ae',
  rose: '#f0abfc',
  gold: '#fbbf24',
  cyan: '#67e8f9',
  white: 'rgba(255,255,255,0.9)',
  dim: 'rgba(255,255,255,0.15)',
  faint: 'rgba(255,255,255,0.05)',
};

// ── Node state ──
const NODE_COLORS = [COL.lilac, COL.rose, COL.mint];
const NODE_DEFAULTS = [
  { id:'phone-1', name:'Primary', online:false, lat:0, lng:0, battery:-1, detections:0 },
  { id:'phone-2', name:'Kitchen', online:false, lat:0, lng:0, battery:-1, detections:0 },
  { id:'phone-3', name:'Garage',  online:false, lat:0, lng:0, battery:-1, detections:0 },
];
let nodes = JSON.parse(JSON.stringify(NODE_DEFAULTS));
let detections = [];
let scanPulse = 0; // 0–1 for scan animation

// ── Resize ──
function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Background grid
// ═══════════════════════════════════════════════════════════════════════
function drawGrid(){
  const spacing = 40;
  ctx.strokeStyle = COL.faint;
  ctx.lineWidth = 0.5;
  for(let x = 0; x < W; x += spacing){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y = 0; y < H; y += spacing){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Vision Sphere (rotating detection rings)
// ═══════════════════════════════════════════════════════════════════════
function drawVisionSphere(radius){
  const rings = 5;
  const breathe = Math.sin(t * 0.8) * 8;

  // Outer glow
  const grd = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius + 30);
  grd.addColorStop(0, 'rgba(139,122,158,0.08)');
  grd.addColorStop(0.7, 'rgba(192,132,252,0.04)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx, cy, radius + 30, 0, Math.PI*2); ctx.fill();

  // Rings
  for(let i = 0; i < rings; i++){
    const r = (radius * 0.35) + (radius * 0.65) * (i / rings) + breathe;
    const alpha = 0.08 + (1 - i/rings) * 0.12;
    const rotSpeed = (i % 2 === 0 ? 1 : -1) * (0.2 + i * 0.08);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * rotSpeed);

    // Draw ellipse (tilted ring)
    ctx.strokeStyle = `rgba(168,146,184,${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.4, i * 0.3, 0, Math.PI * 2);
    ctx.stroke();

    // Detection dots on ring
    const dotCount = 3 + i;
    for(let d = 0; d < dotCount; d++){
      const angle = (d / dotCount) * Math.PI * 2 + t * (0.5 + i * 0.1);
      const dx = Math.cos(angle) * r;
      const dy = Math.sin(angle) * r * 0.4;
      const dotAlpha = 0.3 + Math.sin(t * 2 + d) * 0.3;
      ctx.fillStyle = `rgba(192,132,252,${dotAlpha})`;
      ctx.beginPath(); ctx.arc(dx, dy, 2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Animated Lilly Puppy (center)
// ═══════════════════════════════════════════════════════════════════════
function drawLilly(){
  const breathe = Math.sin(t * 1.2) * 3;
  const tilt = Math.sin(t * 0.7) * 0.03;
  const earWiggle = Math.sin(t * 2.5) * 2;
  const tailWag = Math.sin(t * 3) * 0.15;
  const eyeBlink = Math.sin(t * 0.4) > 0.97 ? 1 : 0; // occasional blink

  const s = Math.min(W, H) * 0.07; // scale

  ctx.save();
  ctx.translate(cx, cy + breathe);
  ctx.rotate(tilt);

  // ── Body (soft oval) ──
  ctx.fillStyle = 'rgba(168,146,184,0.15)';
  ctx.strokeStyle = 'rgba(168,146,184,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.3, s * 1.1, s * 1.4, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // ── Head ──
  ctx.fillStyle = 'rgba(168,146,184,0.2)';
  ctx.beginPath();
  ctx.arc(0, -s * 0.8, s * 0.85, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // ── Ears (floppy) ──
  ctx.fillStyle = 'rgba(192,132,252,0.2)';
  ctx.strokeStyle = 'rgba(192,132,252,0.5)';
  // Left ear
  ctx.save();
  ctx.translate(-s * 0.55, -s * 1.3);
  ctx.rotate(-0.2 + earWiggle * 0.02);
  ctx.beginPath();
  ctx.ellipse(0, s * 0.4, s * 0.35, s * 0.65, -0.15, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  // Right ear
  ctx.save();
  ctx.translate(s * 0.55, -s * 1.3);
  ctx.rotate(0.2 - earWiggle * 0.02);
  ctx.beginPath();
  ctx.ellipse(0, s * 0.4, s * 0.35, s * 0.65, 0.15, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // ── Eyes ──
  const eyeY = -s * 0.9;
  const eyeSpacing = s * 0.3;
  if(eyeBlink < 1){
    // Left eye
    ctx.fillStyle = 'rgba(105,240,174,0.9)';
    ctx.beginPath();
    ctx.arc(-eyeSpacing, eyeY, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0a12';
    ctx.beginPath();
    ctx.arc(-eyeSpacing, eyeY, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
    // Eye highlight
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(-eyeSpacing - s*0.03, eyeY - s*0.03, s * 0.03, 0, Math.PI * 2);
    ctx.fill();

    // Right eye
    ctx.fillStyle = 'rgba(105,240,174,0.9)';
    ctx.beginPath();
    ctx.arc(eyeSpacing, eyeY, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0a12';
    ctx.beginPath();
    ctx.arc(eyeSpacing, eyeY, s * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(eyeSpacing - s*0.03, eyeY - s*0.03, s * 0.03, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // Blink (closed eyes)
    ctx.strokeStyle = 'rgba(105,240,174,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-eyeSpacing - s*0.1, eyeY); ctx.lineTo(-eyeSpacing + s*0.1, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeSpacing - s*0.1, eyeY); ctx.lineTo(eyeSpacing + s*0.1, eyeY); ctx.stroke();
  }

  // ── Nose ──
  ctx.fillStyle = 'rgba(240,171,252,0.7)';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.6);
  ctx.lineTo(-s * 0.08, -s * 0.52);
  ctx.lineTo(s * 0.08, -s * 0.52);
  ctx.closePath();
  ctx.fill();

  // ── Mouth (happy curve) ──
  ctx.strokeStyle = 'rgba(168,146,184,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(-s * 0.12, -s * 0.45, s * 0.12, 0.2, Math.PI - 0.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(s * 0.12, -s * 0.45, s * 0.12, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // ── Tail ──
  ctx.strokeStyle = 'rgba(168,146,184,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(s * 0.7, s * 0.1);
  ctx.quadraticCurveTo(s * 1.3, -s * 0.3 + Math.sin(t * 3) * s * 0.4, s * 1.1, -s * 0.8 + Math.sin(t * 3) * s * 0.3);
  ctx.stroke();

  // ── Paws ──
  ctx.fillStyle = 'rgba(168,146,184,0.15)';
  ctx.strokeStyle = 'rgba(168,146,184,0.4)';
  ctx.lineWidth = 1.5;
  // Left paw
  ctx.beginPath(); ctx.ellipse(-s*0.4, s*1.5, s*0.25, s*0.15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // Right paw
  ctx.beginPath(); ctx.ellipse(s*0.4, s*1.5, s*0.25, s*0.15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Node positions on outer ring
// ═══════════════════════════════════════════════════════════════════════
function drawNodes(){
  const ringR = Math.min(W, H) * 0.38;
  const onlineCount = nodes.filter(n => n.online).length;

  // Draw track ring
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI * 2); ctx.stroke();

  // Position nodes evenly on ring
  const angleStep = (Math.PI * 2) / nodes.length;
  const nodePositions = [];

  nodes.forEach((node, i) => {
    const angle = -Math.PI/2 + angleStep * i;
    const nx = cx + Math.cos(angle) * ringR;
    const ny = cy + Math.sin(angle) * ringR;
    nodePositions.push({ x: nx, y: ny });

    const col = NODE_COLORS[i];
    const online = node.online;

    // Pulse ring for online nodes
    if(online){
      const pulse = (Math.sin(t * 2 + i) + 1) * 0.5;
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.1 + pulse * 0.15;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(nx, ny, 20 + pulse * 10, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Node circle
    ctx.fillStyle = online ? col : 'rgba(255,255,255,0.08)';
    ctx.globalAlpha = online ? 0.9 : 0.3;
    ctx.beginPath(); ctx.arc(nx, ny, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Border
    ctx.strokeStyle = online ? col : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(nx, ny, 14, 0, Math.PI * 2); ctx.stroke();

    // Phone icon (center dot)
    ctx.fillStyle = online ? '#0d0a12' : 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(nx, ny, 4, 0, Math.PI * 2); ctx.fill();

    // Label
    ctx.fillStyle = online ? col : 'rgba(255,255,255,0.3)';
    ctx.font = '600 11px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(node.name, nx, ny + 28);

    // Battery indicator
    if(node.battery >= 0){
      ctx.font = '10px -apple-system, system-ui, sans-serif';
      ctx.fillStyle = node.battery > 20 ? 'rgba(105,240,174,0.6)' : 'rgba(229,115,115,0.8)';
      ctx.fillText(Math.round(node.battery) + '%', nx, ny + 40);
    }
  });

  // ── Inter-node detection lines ──
  for(let i = 0; i < nodePositions.length; i++){
    for(let j = i + 1; j < nodePositions.length; j++){
      const a = nodes[i], b = nodes[j];
      const pa = nodePositions[i], pb = nodePositions[j];

      if(a.online && b.online){
        // Active detection line (animated)
        const pulse = (Math.sin(t * 1.5 + i + j) + 1) * 0.5;
        ctx.strokeStyle = `rgba(192,132,252,${0.15 + pulse * 0.2})`;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.setLineDash([]);

        // Detection beam particles
        const progress = (t * 0.5 + i * 0.3) % 1;
        const px = pa.x + (pb.x - pa.x) * progress;
        const py = pa.y + (pb.y - pa.y) * progress;
        ctx.fillStyle = `rgba(192,132,252,${0.6 + pulse * 0.3})`;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();

        // Midpoint label
        const mx = (pa.x + pb.x) / 2;
        const my = (pa.y + pb.y) / 2 - 8;
        ctx.fillStyle = 'rgba(192,132,252,0.4)';
        ctx.font = '9px -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('detecting', mx, my);
      } else if(a.online || b.online){
        // One online — faint dotted line
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 8]);
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Scan pulse (ripple from center)
// ═══════════════════════════════════════════════════════════════════════
function drawScanPulse(){
  if(scanPulse <= 0) return;
  const maxR = Math.min(W, H) * 0.45;
  const r = maxR * (1 - scanPulse);
  ctx.strokeStyle = `rgba(192,132,252,${scanPulse * 0.4})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  scanPulse -= 0.008;
}

// ═══════════════════════════════════════════════════════════════════════
// DRAW: Floating particles
// ═══════════════════════════════════════════════════════════════════════
const particles = Array.from({length: 30}, () => ({
  x: Math.random(), y: Math.random(),
  vx: (Math.random() - 0.5) * 0.0003,
  vy: (Math.random() - 0.5) * 0.0003,
  r: Math.random() * 2 + 0.5,
  a: Math.random() * 0.3 + 0.05,
}));

function drawParticles(){
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0) p.x = 1; if(p.x > 1) p.x = 0;
    if(p.y < 0) p.y = 1; if(p.y > 1) p.y = 0;
    const flicker = 0.5 + Math.sin(t * 2 + p.x * 10) * 0.5;
    ctx.fillStyle = `rgba(168,146,184,${p.a * flicker})`;
    ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2); ctx.fill();
  });
}

// ═══════════════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════════════
function frame(){
  t += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Background
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bg.addColorStop(0, 'rgba(30,20,45,1)');
  bg.addColorStop(1, COL.bg);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawParticles();
  drawVisionSphere(Math.min(W, H) * 0.25);
  drawNodes();
  drawLilly();
  drawScanPulse();

  requestAnimationFrame(frame);
}
frame();

// ═══════════════════════════════════════════════════════════════════════
// DATA POLLING
// ═══════════════════════════════════════════════════════════════════════
async function pollNodes(){
  try {
    const r = await fetch('/api/nodes');
    const d = await r.json();
    if(d.nodes && d.nodes.length){
      nodes = d.nodes.slice(0, 3).map((n, i) => ({
        id: n.node_id,
        name: n.name || n.node_id,
        online: n.online,
        lat: n.last_gps_lat || 0,
        lng: n.last_gps_lng || 0,
        battery: n.battery_pct,
        detections: 0,
      }));
      // Pad to 3 if fewer
      while(nodes.length < 3) nodes.push({...NODE_DEFAULTS[nodes.length], online: false});
    }
    updateSidebar();
  } catch(e){}

  // Fetch recent detections from tracker
  try {
    const r = await fetch('/api/tracker/sightings?limit=5');
    const d = await r.json();
    if(d.sightings){
      detections = d.sightings.reverse().slice(0, 5);
      updateDetections();
      // Update detection count on nodes
      detections.forEach(s => {
        const node = nodes.find(n => n.id === s.node_id);
        if(node) node.detections++;
      });
    }
  } catch(e){}
}

function updateSidebar(){
  const el = document.getElementById('nodeList');
  // Device = this phone / primary node (first online node, else nodes[0])
  const dev = nodes.find(n => n.online) || nodes[0];
  if(dev){
    const dstatus = dev.online ? 'ONLINE' : 'OFF';
    const dstatusClass = dev.online ? 'node-on' : 'node-off';
    const dbat = dev.battery >= 0 ? ` · ${Math.round(dev.battery)}%` : '';
    document.getElementById('deviceCard').innerHTML = `<div class="device-card">
      <div class="node-dot" style="background:#69f0ae;color:#69f0ae"></div>
      <div class="node-name">${dev.name}${dbat}</div>
      <span class="node-status ${dstatusClass}">${dstatus}</span>
    </div>`;
  }
  el.innerHTML = nodes.map((n, i) => {
    const col = NODE_COLORS[i];
    const status = n.online ? 'ONLINE' : 'OFF';
    const statusClass = n.online ? 'node-on' : 'node-off';
    const bat = n.battery >= 0 ? ` · ${Math.round(n.battery)}%` : '';
    return `<div class="node-card" style="border-left:3px solid ${col}">
      <div class="node-dot" style="background:${col};color:${col}"></div>
      <div class="node-name">${n.name}${bat}</div>
      <span class="node-status ${statusClass}">${status}</span>
    </div>`;
  }).join('');
}

function updateDetections(){
  const el = document.getElementById('detectionLog');
  if(!detections.length){ el.innerHTML = '<div>No detections yet</div>'; return; }
  el.innerHTML = detections.map(d => {
    const time = new Date(d.timestamp * 1000).toLocaleTimeString();
    return `<div><span class="det-name">${d.name}</span> <span class="det-time">${time}</span></div>`;
  }).join('');
}

// Initial + periodic poll
pollNodes();
setInterval(pollNodes, 4000);

// Trigger scan animation on click
canvas.addEventListener('click', () => { scanPulse = 1; });

// ═══════════════════════════════════════════════════════════════════════
// WINDOW CONTROLS — full-display mode (opened from the Android overlay)
// ═══════════════════════════════════════════════════════════════════════
const isApp = new URLSearchParams(location.search).get('from') === 'app';

function minimizeHub(){
  if(window.RadarBridge && RadarBridge.minimize){ try{ RadarBridge.minimize(); }catch(e){} }
  document.getElementById('hub').style.display = 'none';
  document.getElementById('minPill').style.display = 'block';
}

function restoreHub(){
  if(window.RadarBridge && RadarBridge.restore){ try{ RadarBridge.restore(); }catch(e){} }
  document.getElementById('hub').style.display = 'block';
  document.getElementById('minPill').style.display = 'none';
}

function closeHub(){
  // Native overlay close via JS bridge (added to the radar WebView)
  try{
    if(window.RadarBridge && RadarBridge.close){ RadarBridge.close(); return; }
    if(window.LillyBridge && LillyBridge.close){ LillyBridge.close(); return; }
  }catch(e){}
  try{ window.close(); }catch(e){}
  minimizeHub(); // last-resort collapse
}

// ═══════════════════════════════════════════════════════════════════════
// VOICE CONTROL — Web Speech API + Lilly chat
// ═══════════════════════════════════════════════════════════════════════
let recognition = null;
let isListening = false;
let ttsEnabled = true;

function initSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.continuous = false;
  r.interimResults = true;
  r.lang = 'en-US';
  r.onresult = (e) => {
    let final = '';
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += transcript;
      else interim += transcript;
    }
    showTranscript(interim || final, false);
    if(final.trim()) handleVoiceCommand(final.trim());
  };
  r.onend = () => {
    isListening = false;
    document.getElementById('voiceBtn').classList.remove('listening');
    setTimeout(() => hideTranscript(), 2000);
  };
  r.onerror = (e) => {
    if(e.error !== 'no-speech' && e.error !== 'aborted'){
      console.warn('Speech error:', e.error);
    }
    isListening = false;
    document.getElementById('voiceBtn').classList.remove('listening');
  };
  return r;
}

function toggleVoice(){
  if(!recognition) recognition = initSpeech();
  if(!recognition){
    showLillyResponse("Speech recognition isn't available in this browser. Try Chrome!");
    return;
  }
  if(isListening){
    recognition.stop();
  } else {
    recognition.start();
    isListening = true;
    document.getElementById('voiceBtn').classList.add('listening');
    showTranscript('Listening...', true);
  }
}

function showTranscript(text, isFinal){
  const el = document.getElementById('transcript');
  const txt = document.getElementById('transcriptText');
  txt.textContent = text;
  el.classList.add('show');
}
function hideTranscript(){
  document.getElementById('transcript').classList.remove('show');
}

let responseTimeout = null;
function showLillyResponse(text){
  const el = document.getElementById('lillyResponse');
  const txt = document.getElementById('lillyText');
  txt.textContent = text;
  el.classList.add('show');
  if(responseTimeout) clearTimeout(responseTimeout);
  responseTimeout = setTimeout(() => el.classList.remove('show'), 12000);

  // TTS
  if(ttsEnabled && 'speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    u.pitch = 1.1;
    u.volume = 0.85;
    // Prefer a warm female voice
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /samantha|zira|google uk english female|google.*female/i.test(v.name));
    if(preferred) u.voice = preferred;
    window.speechSynthesis.speak(u);
  }

  // Visual: pulse the avatar
  scanPulse = 1;
}

async function handleVoiceCommand(text){
  const lower = text.toLowerCase();
  scanPulse = 1; // visual feedback

  // ── Quick local commands (no server needed) ──
  if(lower.includes('scan') || lower.includes('refresh')){
    pollNodes();
    showLillyResponse("Scanning all nodes now!");
    return;
  }
  if(lower.includes('battery') || lower.includes('charge')){
    const online = nodes.filter(n => n.online);
    if(!online.length){ showLillyResponse("No nodes online right now."); return; }
    const bat = online.map(n => `${n.name}: ${n.battery >= 0 ? Math.round(n.battery) + '%' : 'unknown'}`).join(', ');
    showLillyResponse(`Battery levels: ${bat}`);
    return;
  }
  if(lower.includes('status') || lower.includes('nodes')){
    const online = nodes.filter(n => n.online).length;
    showLillyResponse(`${online} of ${nodes.length} nodes online. ${detections.length} recent detections.`);
    return;
  }
  if(lower.includes('detections') || lower.includes('faces') || lower.includes('people')){
    if(!detections.length){ showLillyResponse("No detections yet. Let's wait a bit."); return; }
    const names = [...new Set(detections.map(d => d.name))];
    showLillyResponse(`I see: ${names.join(', ')}`);
    return;
  }
  if(lower.includes('mute') || lower.includes('quiet')){
    ttsEnabled = false;
    showLillyResponse("TTS muted. I'll still show text.");
    return;
  }
  if(lower.includes('unmute') || lower.includes('speak')){
    ttsEnabled = true;
    showLillyResponse("Voice is back on!");
    return;
  }

  // ── Send to Lilly AI server ──
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text, context: 'radar_hub' }),
    });
    const data = await resp.json();
    const reply = data.response || data.reply || data.message || "I didn't understand that.";
    showLillyResponse(reply);
  } catch(e){
    // Fallback if /api/chat doesn't exist
    showLillyResponse(`I heard: "${text}" — but I can't reach the chat server right now.`);
  }
}

// Load voices for TTS
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Keyboard shortcut: Space to toggle voice
document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && e.target === document.body){
    e.preventDefault();
    toggleVoice();
  }
});
