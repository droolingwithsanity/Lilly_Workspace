<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lilly Radar</title>
<!-- Leaflet (real map tiles) — matches the pyfile reference -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0d0a12;
    --lavender:#a892b8;
    --purple:#8b7a9e;
    --lilac:#c084fc;
    --mint:#69f0ae;
    --rose:#f0abfc;
    --gold:#fbbf24;
    --cyan:#67e8f9;
    --danger:#e57373;
    --text:#e8e0f0;
    --dim:rgba(255,255,255,0.45);
    --faint:rgba(255,255,255,0.07);
    --glass:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  #hub{position:fixed;inset:0}
  #map{position:absolute;inset:0;background:#141019;z-index:1}
  /* ── Glass panel helpers ── */
  .glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:18px}

  /* ── Title (top-left) ── */
  #title{position:absolute;top:16px;left:16px;z-index:10;pointer-events:auto}
  .title-row{display:flex;align-items:flex-start;gap:12px}
  #title h1{font-size:18px;font-weight:700;color:var(--lavender);text-shadow:0 0 20px rgba(168,146,184,0.35);letter-spacing:.3px}
  #title p{font-size:11px;color:var(--dim);margin-top:2px}
  .win-controls{display:flex;gap:6px;margin-top:2px}
  .win-controls button{width:30px;height:30px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(12px);color:var(--lilac);font-size:15px;font-weight:700;line-height:1;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
  .win-controls button:hover{background:rgba(192,132,252,0.22);border-color:rgba(192,132,252,0.5);box-shadow:0 0 12px rgba(192,132,252,.25)}
  .win-controls .min-btn:hover{background:rgba(105,240,174,.18);border-color:rgba(105,240,174,.4);color:var(--mint)}
  .win-controls .close-btn:hover{background:rgba(229,115,115,.2);border-color:rgba(229,115,115,.5);color:var(--danger)}

  /* ── Sidebar (right, lavender glass) ── */
  #sidebar{position:absolute;top:16px;right:16px;width:288px;z-index:10;pointer-events:auto;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:18px;padding:14px;box-shadow:0 8px 40px rgba(0,0,0,.45)}
  .side-h2{font-size:11px;font-weight:700;color:var(--lavender);margin:0 0 8px;letter-spacing:.6px;text-transform:uppercase}
  .side-h2.top{margin-top:0}
  .side-section{margin-top:12px}
  /* Status bar */
  #statusBox{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);font-size:11px}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0;box-shadow:0 0 6px currentColor}
  .pulse-dot.live{background:var(--mint);color:var(--mint);animation:pulse 1.6s infinite}
  #statusText{flex:1;color:var(--dim)}
  #gpsRead{color:var(--cyan);font-family:ui-monospace,monospace;font-size:9px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* Buttons */
  .btn-group{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:9px;border:none;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer;color:#fff;transition:opacity .2s;background:linear-gradient(140deg,#8b7a9e,#a892b8)}
  .btn:active{opacity:.7}
  .btn-accent{background:linear-gradient(140deg,#6f9bd6,#8b7a9e)}
  /* Node cards */
  #nodeList{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow-y:auto}
  .node-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);border-left:3px solid var(--nc,#8b7a9e);transition:all .3s}
  .node-card.off{opacity:.55}
  .node-dot{width:10px;height:10px;border-radius:50%;background:var(--nc,#8b7a9e);box-shadow:0 0 6px var(--nc,#8b7a9e);flex-shrink:0;cursor:pointer}
  .node-name{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node-meta{font-size:9px;color:var(--dim)}
  .node-status{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:700;white-space:nowrap}
  .node-on{background:rgba(105,240,174,.16);color:var(--mint)}
  .node-off{background:rgba(255,255,255,.07);color:rgba(255,255,255,.35)}
  /* Device feed */
  #feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:60px;max-height:30vh}
  .dev-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--glass-border);font-size:11px;border-left:3px solid var(--dc,#8b7a9e)}
  .dev-item .d-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text);min-width:0}
  .dev-item .d-meta{color:var(--dim);font-size:9px;white-space:nowrap}
  .tag{display:inline-block;padding:1px 5px;border-radius:6px;font-size:8px;font-weight:700;background:var(--gold);color:#000;margin-left:5px;flex-shrink:0}
  .tag.wifi{background:var(--cyan);color:#000}
  .empty{color:rgba(255,255,255,.35);text-align:center;font-size:11px;padding:14px}

  /* ── Lilly pup avatar (branding, bottom-left) ── */
  #pupBox{position:absolute;left:16px;bottom:16px;z-index:10;pointer-events:auto;padding:8px;width:116px;text-align:center}
  #pupBox .pup-glare{font-size:9px;color:var(--lilac);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
  #pupCanvas{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 18px rgba(192,132,252,.35))}

  /* Minimized pill */
  #minPill{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:auto;padding:10px 22px;border-radius:999px;border:1px solid rgba(192,132,252,.4);background:rgba(29,23,38,.75);backdrop-filter:blur(16px);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 0 24px rgba(192,132,252,.2)}
  .leaflet-popup-content-wrapper{background:rgba(29,23,38,.92)!important;color:var(--text)!important;border-radius:12px!important;backdrop-filter:blur(10px)}
  .leaflet-popup-tip{background:rgba(29,23,38,.92)!important}
  .leaflet-popup-content{font-family:system-ui,sans-serif!important;font-size:11px!important;margin:10px 12px!important;line-height:1.5}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:rgba(168,146,184,.35);border-radius:3px}
  @media (max-width:720px){
    #sidebar{width:min(288px,86vw);top:auto;bottom:12px;right:12px;max-height:54vh}
    #pupBox{display:none}
  }
</style>
</head>
<body>
<div id="hub">
  <div id="map"></div>

  <div id="title">
    <div class="title-row">
      <div>
        <h1>🐾 Lilly Radar</h1>
        <p id="subtitle">0 nodes online · triangulation</p>
      </div>
      <div class="win-controls">
        <button class="min-btn" onclick="minimizeHub()" title="Minimize">−</button>
        <button class="close-btn" onclick="closeHub()" title="Close">✕</button>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div class="side-h2 top">Proximity Radar</div>
    <div id="statusBox">
      <span class="pulse-dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <span id="gpsRead"></span>
    </div>
    <div class="btn-group">
      <button class="btn btn-accent" onclick="forceRescan()">⚡ Rescan</button>
      <button class="btn" onclick="openAMSettings()">⚙ Settings</button>
    </div>
    <div class="side-section">
      <div class="side-h2">📡 Nodes <span id="nodeCount"></span></div>
      <div id="nodeList"><div class="empty">No nodes registered yet.</div></div>
    </div>
    <div class="side-section">
      <div class="side-h2">👀 Devices <span id="devCount"></span></div>
      <div id="feed"><div class="empty">Scanning for nearby devices…</div></div>
    </div>
  </div>

  <div id="pupBox" class="glass">
    <canvas id="pupCanvas" width="240" height="240"></canvas>
    <div class="pup-glare">Lilly</div>
  </div>

  <div id="minPill" style="display:none" onclick="restoreHub()">🐾 Lilly Radar — tap to expand</div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// Lilly Radar — Multi-node proximity radar on a real map.
// Aggregates GPS + WiFi + Bluetooth scans from every online phone node
// (via the host's cached /api/nodes/fleet), triangulates each detected
// device by intersecting range circles, and plots movement trails.
// Theme: WebUI lavender + glassmorphism, with the Lilly pup avatar.
// ══════════════════════════════════════════════════════════════════

const EARTH_R = 6378137;
const NODE_COLORS = ['#c084fc', '#f0abfc', '#69f0ae', '#67e8f9', '#fbbf24', '#e57373'];
const KNOWN_TRACKERS = ['tile', 'chipolo', 'pebblebee', 'smarttag', 'moto tag', 'airtag'];

const map = L.map('map', { zoomControl: false }).setView([45, -75], 13);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const nodeMarkers = {};      // node_id -> L.circleMarker
let    nodeEntries = [];     // [{node_id,name,lat,lng,online,battery,color}]
let    deviceState = {};     // key -> {history, marker, polyline, color, name}

function hashAngle(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return (Math.abs(h) % 360) * (Math.PI / 180);
}
// RSSI -> distance (meters) using the free-space path-loss reference from the pyfile.
function rssiToDist(rssi, freq){
  if (rssi === null || rssi === undefined || rssi === 0) return null;
  const f = (!freq || freq < 2000) ? 2412 : freq;
  const exp = (27.55 - (20 * Math.log10(f)) + Math.abs(rssi)) / 20.0;
  const d = Math.pow(10, exp);
  return Math.min(d, 300);
}
function offsetFrom(lat, lng, distM, angleRad){
  const dLat = (distM * Math.cos(angleRad)) / EARTH_R;
  const dLng = (distM * Math.sin(angleRad)) / (EARTH_R * Math.cos(Math.PI * lat / 180));
  return { lat: lat + (dLat * 180 / Math.PI), lng: lng + (dLng * 180 / Math.PI) };
}
function toLocal(lat, lng, refLat, refLng){
  return {
    x: EARTH_R * Math.cos(refLat * Math.PI / 180) * (lng - refLng) * Math.PI / 180,
    y: EARTH_R * (lat - refLat) * Math.PI / 180,
  };
}
function toLatLng(x, y, refLat, refLng){
  return {
    lat: refLat + (y / EARTH_R) * 180 / Math.PI,
    lng: refLng + (x / (EARTH_R * Math.cos(refLat * Math.PI / 180))) * 180 / Math.PI,
  };
}
// Triangulate a device given observations [{lat,lng,rssi,freq}] across nodes.
function triangulate(obs){
  const est = obs.map(o => offsetFrom(o.lat, o.lng, rssiToDist(o.rssi, o.freq) || 20, hashAngle(o.key + o.node_id)));
  if (obs.length >= 2){
    const ds = obs.map(o => rssiToDist(o.rssi, o.freq) || 20);
    const refL = toLocal(obs[0].lat, obs[0].lng, obs[0].lat, obs[0].lng);
    const A = [], b = [];
    for (let i = 1; i < obs.length; i++){
      const pi = toLocal(obs[i].lat, obs[i].lng, obs[0].lat, obs[0].lng);
      A.push([2*(pi.x - refL.x), 2*(pi.y - refL.y)]);
      b.push(ds[0]*ds[0] - ds[i]*ds[i] + (pi.x*pi.x + pi.y*pi.y) - (refL.x*refL.x + refL.y*refL.y));
    }
    const ATA00 = A.reduce((s,r)=>s+r[0]*r[0],0), ATA01 = A.reduce((s,r)=>s+r[0]*r[1],0), ATA11 = A.reduce((s,r)=>s+r[1]*r[1],0);
    const ATb0  = A.reduce((s,r,i)=>s+r[0]*b[i],0), ATb1 = A.reduce((s,r,i)=>s+r[1]*b[i],0);
    const det = ATA00*ATA11 - ATA01*ATA01;
    if (Math.abs(det) > 1e-12){
      const x = (ATA11*ATb0 - ATA01*ATb1) / det;
      const y = (ATA00*ATb1 - ATA01*ATb0) / det;
      const sol = toLatLng(x + refL.x, y + refL.y, obs[0].lat, obs[0].lng);
      const maxD = Math.max(...obs.map(o=>distM(sol.lat,sol.lng,o.lat,o.lng)));
      if (maxD < 400) return sol;   // plausible intersection
    }
  }
  return { lat: est.reduce((s,p)=>s+p.lat,0)/est.length, lng: est.reduce((s,p)=>s+p.lng,0)/est.length };
}
function distM(lat1,lng1,lat2,lng2){
  const R = EARTH_R, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function setStatus(text, live){
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'pulse-dot' + (live ? ' live' : '');
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function updateNodeMarkers(){
  for (const k in nodeMarkers){ if(!nodeEntries.some(n=>n.node_id===k)){ map.removeLayer(nodeMarkers[k]); delete nodeMarkers[k]; } }
  nodeEntries.forEach(n => {
    const col = n.color;
    if (nodeMarkers[n.node_id]){
      if (n.lat && n.lng) nodeMarkers[n.node_id].setLatLng([n.lat,n.lng]);
      nodeMarkers[n.node_id].setStyle({color:col, fillColor:col, fillOpacity:n.online?0.85:0.3});
    } else {
      const m = L.circleMarker([n.lat||0,n.lng||0], {radius:10,color:'#fff',weight:2,fillColor:col,fillOpacity:n.online?0.85:0.3})
        .addTo(map).bindPopup(`<b>${esc(n.name)}</b><br>${n.online?'🟢 online':'⚫ offline'}${n.lat&&n.lng?'<br>📍 '+n.lat.toFixed(5)+', '+n.lng.toFixed(5):''}${n.battery>=0?'<br>🔋 '+Math.round(n.battery)+'%':''}`);
      nodeMarkers[n.node_id] = m;
    }
  });
}

function updateDevice(key, lat, lng, name, color, isWifi, isTracker){
  let d = deviceState[key];
  if (!d){
    d = deviceState[key] = { history: [], marker: null, polyline: null, color, name };
    d.marker = L.circleMarker([lat,lng], {radius:6,color:'#fff',weight:1.5,fillColor:color,fillOpacity:.9}).addTo(map).bindPopup('');
    d.polyline = L.polyline([], {color,weight:2.5,opacity:.65,dashArray:'5, 5'}).addTo(map);
  }
  if (d.color!==color){ d.color=color; d.marker.setStyle({fillColor:color}); d.polyline.setStyle({color}); }
  d.name = name;
  const last = d.history[d.history.length-1];
  if (!last || distM(last[0],last[1],lat,lng) > 1.5){
    d.history.push([lat,lng]);
    if (d.history.length > 40) d.history.shift();
  }
  d.marker.setLatLng([lat,lng]);
  d.polyline.setLatLngs(d.history);
  d.marker.bindPopup(`<b>${esc(name)}</b>${isTracker?'<br>🏷️ Tracker':''}${isWifi?'<br>📶 WiFi':''}<br>📏 ${d.history.length} ping${d.history.length>1?'s':''}<br>📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
}
function pruneDevices(present){
  for (const k in deviceState){
    if (!present.has(k)){
      map.removeLayer(deviceState[k].marker);
      if (deviceState[k].polyline) map.removeLayer(deviceState[k].polyline);
      delete deviceState[k];
    }
  }
}

async function load(){
  try {
    const d = await (await fetch('/api/nodes/fleet')).json();
    const nodes = d.nodes || [];
    nodeEntries = [];
    const observations = {};
    let haveGps = false, onlineCount = 0;

    nodes.forEach(({node, snapshot}, idx) => {
      const onlineFlag = node.online === true;
      if (onlineFlag) onlineCount++;
      const color = NODE_COLORS[idx % NODE_COLORS.length];
      const snap = snapshot || {};
      const gps = snap.gps || {};
      const gl = (gps.location && typeof gps.location === 'object') ? gps.location : gps;
      let lat = parseFloat(gl.latitude || gl.lat || node.last_gps_lat || 0);
      let lng = parseFloat(gl.longitude || gl.lng || node.last_gps_lng || 0);
      const battery = _batteryLevel(snap.battery);
      nodeEntries.push({ node_id: node.node_id || idx, name: node.name || node.node_id || idx, lat, lng, online: onlineFlag, battery, color });

      if (!onlineFlag) return;
      if (lat && lng) haveGps = true;

      const wifi = snap.wifi || {};
      const wnets = Array.isArray(wifi) ? wifi : (wifi.networks || []);
      wnets.forEach(n => {
        const key = n.bssid || ('wifi:' + (n.ssid||'?'));
        if (!observations[key]) observations[key] = [];
        observations[key].push({ node_id: node.node_id||idx, lat, lng, rssi: n.rssi, freq: n.frequency, key, name: n.ssid || 'Hidden WiFi', isWifi: true, isTracker: false });
      });
      const bt = snap.bluetooth || {};
      const bdevs = Array.isArray(bt) ? bt : (bt.devices || []);
      bdevs.forEach(b => {
        const key = 'bt:' + (b.address || (b.name||'?'));
        const nm = b.name || 'Unknown BLE Tag';
        const isTracker = KNOWN_TRACKERS.some(t => nm.toLowerCase().includes(t)) || nm === 'Unknown BLE Tag';
        if (!observations[key]) observations[key] = [];
        observations[key].push({ node_id: node.node_id||idx, lat, lng, rssi: b.rssi, freq: 2400, key, name: nm, isWifi: false, isTracker });
      });
    });

    // Triangulate each device across all nodes that see it.
    const present = new Set();
    const feed = [];
    for (const key in observations){
      const good = observations[key].filter(o => o.lat && o.lng && o.rssi);
      if (!good.length) continue;
      const pos = triangulate(good);
      const src = observations[key][0];
      const color = src.isWifi ? '#67e8f9' : (src.isTracker ? '#fbbf24' : '#c084fc');
      updateDevice(key, pos.lat, pos.lng, src.name, color, src.isWifi, src.isTracker);
      present.add(key);
      const avgD = Math.round(good.reduce((s,o)=>s+(rssiToDist(o.rssi,o.freq)||20),0)/good.length);
      feed.push(`<div class="dev-item" style="--dc:${color}"><span class="d-name">${esc(src.name)}</span>${src.isTracker?'<span class="tag">TRACKER</span>':''}${src.isWifi?'<span class="tag wifi">WIFI</span>':''}<span class="d-meta">~${avgD}m · ${good.length}n</span></div>`);
    }
    pruneDevices(present);
    document.getElementById('feed').innerHTML = feed.length ? feed.join('') : '<div class="empty">No devices in range.</div>';
    document.getElementById('devCount').textContent = feed.length ? `· ${feed.length}` : '';

    const onlineNm = nodeEntries.filter(n=>n.online);
    document.getElementById('nodeCount').textContent = onlineNm.length ? `· ${onlineNm.length}/${nodeEntries.length} online` : '';
    document.getElementById('subtitle').textContent = `${onlineCount} node${onlineCount!==1?'s':''} · ${haveGps?'triangulation active':'awaiting GPS'}`;
    const nl = document.getElementById('nodeList');
    if (!nodeEntries.length){ nl.innerHTML = '<div class="empty">No nodes registered yet.</div>'; }
    else {
      nl.innerHTML = nodeEntries.map(n=>`
        <div class="node-card ${n.online?'':'off'}" style="--nc:${n.color}">
          <span class="node-dot" title="Center map on node" onclick="centerOnNode(${n.lat||0},${n.lng||0})"></span>
          <div style="flex:1;min-width:0">
            <div class="node-name">${esc(n.name)}</div>
            <div class="node-meta">${n.lat&&n.lng? n.lat.toFixed(4)+', '+n.lng.toFixed(4) : 'no GPS'}</div>
          </div>
          <span class="node-status ${n.online?'node-on':'node-off'}">${n.online?'ONLINE':'OFF'}</span>
        </div>`).join('');
    }
    document.getElementById('gpsRead').textContent = (()=>{
      const g = nodeEntries.find(n=>n.online && n.lat && n.lng);
      return g ? g.lat.toFixed(4)+', '+g.lng.toFixed(4) : '';
    })();
    updateNodeMarkers();
    setStatus(haveGps ? `Live · ${onlineCount}/${nodeEntries.length} online` : (onlineCount? 'Online — waiting for GPS' : 'No nodes online'), haveGps || onlineCount>0);
  } catch(e){
    setStatus('Cant reach server', false);
  }
}

function _batteryLevel(bat){
  const b = (bat && bat.battery) || bat || {};
  if (b.level != null) return parseFloat(b.level);
  return -1;
}

function centerOnNode(lat,lng){ if (lat && lng) map.flyTo([lat,lng], 16, {duration:1.2}); }

(async function init(){
  const t = setInterval(() => {
    const n = nodeEntries.find(n => n.online && n.lat && n.lng);
    if (n){ map.setView([n.lat,n.lng], 16); clearInterval(t); }
  }, 3000);
  load();
  setInterval(load, 2500);
})();

async function forceRescan(){
  setStatus('Triggering rescan…', false);
  try {
    const d = await (await fetch('/api/nodes/fleet')).json();
    const tasks = (d.nodes||[]).filter(x=>x.node&&x.node.online).map(async ({node}) => {
      const base = (node.sensor_url||'').replace(/\/$/,'');
      if (!base) return;
      try{ await fetch(base+'/wifi/scan/live'); }catch(e){}
      try{ await fetch(base+'/bluetooth/scan/live'); }catch(e){}
      try{ await fetch(base+'/location/live'); }catch(e){}
    });
    await Promise.all(tasks);
  } catch(e){}
  await new Promise(r=>setTimeout(r,1500));
  load();
  setStatus('Scan complete', true);
}
function openAMSettings(){
  // Best-effort: open system settings on the primary node's sensor server (proxied).
  try{ fetch('/api/termux/exec', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({cmd:'am start -a android.settings.SETTINGS'})}).catch(()=>{}); }catch(e){}
}

// ── Window controls ──
function minimizeHub(){
  if (window.RadarBridge && RadarBridge.minimize){ try{ RadarBridge.minimize(); }catch(e){} }
  document.getElementById('hub').style.display = 'none';
  document.getElementById('minPill').style.display = 'block';
}
function restoreHub(){
  if (window.RadarBridge && RadarBridge.restore){ try{ RadarBridge.restore(); }catch(e){} }
  document.getElementById('hub').style.display = 'block';
  document.getElementById('minPill').style.display = 'none';
}
function closeHub(){
  try{ if(window.RadarBridge&&RadarBridge.close){RadarBridge.close();return;} if(window.LillyBridge&&LillyBridge.close){LillyBridge.close();return;} }catch(e){}
  try{ window.close(); }catch(e){}
  minimizeHub();
}

// ── Lilly pup avatar (branded clay pup) ──
(function drawPup(){
  const cv = document.getElementById('pupCanvas');
  if (!cv) return;
  const c = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H*0.54;
  const pupCol = '#b18ac2', pupDark = '#8a6a9e', ear = '#c084fc', nose = '#e57373';
  function frame(){
    c.clearRect(0,0,W,H);
    const t = performance.now()/1000;
    const bounce = Math.sin(t*1.5)*3;
    const tailW = Math.sin(t*3)*0.5;
    const blink = Math.sin(t*0.7)%1.0 > 0.92;
    c.save();
    c.translate(cx, cy+bounce);
    // Body
    c.fillStyle = pupCol; c.strokeStyle = pupDark; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(0,14,30,26,0,0,Math.PI*2); c.fill(); c.stroke();
    // Paws
    c.beginPath(); c.ellipse(-16,38,9,6,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(16,38,9,6,0,0,Math.PI*2); c.fill();
    c.lineWidth=1; c.beginPath(); c.ellipse(-16,38,9,6,0,0,Math.PI*2); c.stroke();
    c.beginPath(); c.ellipse(16,38,9,6,0,0,Math.PI*2); c.stroke();
    // Tail
    c.strokeStyle=pupDark; c.lineWidth=3; c.lineCap='round';
    c.beginPath(); c.moveTo(26,0); c.quadraticCurveTo(44,-8+tailW*6,40,-24+tailW*8); c.stroke();
    // Head
    c.fillStyle=pupCol; c.lineWidth=1.5;
    c.beginPath(); c.arc(0,-22,26,0,Math.PI*2); c.fill(); c.stroke();
    // Ears
    c.fillStyle=ear;
    c.beginPath(); c.ellipse(-20,-42,10,16,-0.3,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(20,-42,10,16,0.3,0,Math.PI*2); c.fill();
    c.strokeStyle=pupDark; c.stroke();
    // Snout
    c.fillStyle='#d9c4e4';
    c.beginPath(); c.ellipse(0,-13,10,7,0,0,Math.PI*2); c.fill();
    // Eyes
    c.fillStyle='#1a1220';
    if(blink){ c.lineWidth=2; c.beginPath(); c.moveTo(-9,-24); c.lineTo(-3,-24); c.moveTo(3,-24); c.lineTo(9,-24); c.stroke(); }
    else {
      c.beginPath(); c.arc(-6,-24,3.4,0,Math.PI*2); c.fill();
      c.beginPath(); c.arc(6,-24,3.4,0,Math.PI*2); c.fill();
      c.fillStyle='#fff'; c.beginPath(); c.arc(-4.8,-25,1.2,0,Math.PI*2); c.fill();
      c.beginPath(); c.arc(7.2,-25,1.2,0,Math.PI*2); c.fill();
    }
    // Nose
    c.fillStyle=nose; c.beginPath(); c.arc(0,-15,4,0,Math.PI*2); c.fill();
    // Mouth
    c.strokeStyle=pupDark; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(-5,-11); c.quadraticCurveTo(0,-7,5,-11); c.stroke();
    c.restore();
    requestAnimationFrame(frame);
  }
  frame();
})();
