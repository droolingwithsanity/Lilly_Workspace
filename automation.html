<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilly — Live Automation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0a1a;color:#e0d8f0;display:flex;height:100vh}
.sidebar{width:320px;background:#16102a;border-right:1px solid #2a2040;display:flex;flex-direction:column;flex-shrink:0}
.sidebar h2{padding:16px 20px;font-size:1rem;color:#a78bfa;border-bottom:1px solid #2a2040}
.scenario-list{flex:1;overflow-y:auto;padding:8px}
.scenario{padding:12px 16px;margin:4px 0;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .2s;font-size:.85rem}
.scenario:hover{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}
.scenario.active{background:rgba(167,139,250,.15);border-color:#a78bfa}
.scenario .name{font-weight:600;color:#e0d8f0;margin-bottom:4px}
.scenario .desc{color:#8878a8;font-size:.78rem}
.controls{padding:16px;border-top:1px solid #2a2040;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border:none;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-run{background:linear-gradient(135deg,#f472b6,#a78bfa);color:#fff}
.btn-run:hover{box-shadow:0 4px 16px rgba(167,139,250,.4)}
.btn-run:disabled{opacity:.4;cursor:not-allowed}
.btn-stop{background:#f87171;color:#fff}
.btn-stop:hover{background:#ef4444}
.btn-reset{background:#2a2040;color:#a78bfa}
.main{flex:1;display:flex;flex-direction:column}
.topbar{padding:12px 20px;background:#16102a;border-bottom:1px solid #2a2040;display:flex;align-items:center;gap:12px}
.topbar .status{font-size:.8rem;color:#8878a8}
.topbar .status.running{color:#34d399}
.log{flex:1;overflow-y:auto;padding:20px;font-family:'SF Mono',Consolas,monospace;font-size:.8rem;line-height:1.8}
.log .ts{color:#6658a0}
.log .cmd{color:#f472b6}
.log .reply{color:#60a5fa}
.log .info{color:#8878a8}
.log .ok{color:#34d399}
.log .err{color:#f87171}
.log .divider{border-top:1px solid #2a2040;margin:8px 0}
.progress{padding:12px 20px;background:#16102a;border-top:1px solid #2a2040;font-size:.75rem;color:#8878a8;display:flex;gap:16px;align-items:center}
.progress .bar{flex:1;height:4px;background:#2a2040;border-radius:2px;overflow:hidden}
.progress .bar .fill{height:100%;background:linear-gradient(90deg,#f472b6,#a78bfa);transition:width .3s;border-radius:2px}
</style>
</head>
<body>
<div class="sidebar">
  <h2>Scenarios</h2>
  <div class="scenario-list" id="scenarioList"></div>
  <div class="controls">
    <button class="btn btn-run" id="runBtn" onclick="runScenario()">▶ Run</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopScenario()" style="display:none">⏹ Stop</button>
    <button class="btn btn-reset" onclick="clearLog()">Clear</button>
  </div>
</div>
<div class="main">
  <div class="topbar">
    <span style="font-size:1.1rem">Lilly Live Automation</span>
    <span class="status" id="statusText">Connected to :8098</span>
  </div>
  <div class="log" id="log"></div>
  <div class="progress">
    <span id="progressLabel">Ready</span>
    <div class="bar"><div class="fill" id="progressFill" style="width:0"></div></div>
    <span id="progressCount">0/0</span>
  </div>
</div>

<script>
const API = 'http://localhost:8098';
const SCENARIOS = [
  {
    name: "Basic Greeting",
    desc: "Hello + introduction + mood check",
    steps: [
      {cmd: "hello", delay: 2000},
      {cmd: "what's your name?", delay: 2000},
      {cmd: "how are you feeling?", delay: 2000},
      {cmd: "tell me a fun fact", delay: 3000},
    ]
  },
  {
    name: "Sensor Awareness",
    desc: "Environmental sensing through the phone",
    steps: [
      {cmd: "what do you sense around us?", delay: 3000},
      {cmd: "what's the light level like?", delay: 2500},
      {cmd: "are there any devices nearby?", delay: 2500},
      {cmd: "what's the weather doing?", delay: 2500},
    ]
  },
  {
    name: "Vision & Camera",
    desc: "Camera view, object detection, scene description",
    steps: [
      {cmd: "open the camera", delay: 3000},
      {cmd: "what do you see?", delay: 4000},
      {cmd: "describe the scene in detail", delay: 3000},
      {cmd: "close camera", delay: 2000},
    ]
  },
  {
    name: "Maps & Navigation",
    desc: "Find places, navigate, explore nearby",
    steps: [
      {cmd: "where can I get good coffee nearby?", delay: 3000},
      {cmd: "what's the closest one?", delay: 2000},
      {cmd: "navigate there", delay: 3000},
      {cmd: "go back", delay: 2000},
    ]
  },
  {
    name: "Notifications & Alerts",
    desc: "Check messages, missed calls, priority alerts",
    steps: [
      {cmd: "what notifications do I have?", delay: 3000},
      {cmd: "what did I miss?", delay: 2500},
      {cmd: "any important messages?", delay: 2500},
      {cmd: "read the latest email", delay: 3000},
    ]
  },
  {
    name: "Personality Showoff",
    desc: "Character quirks, humor, emotional range",
    steps: [
      {cmd: "tell me a joke", delay: 3000},
      {cmd: "what's your favorite thing?", delay: 2000},
      {cmd: "can you sing?", delay: 3000},
      {cmd: "tell me something deep", delay: 3000},
      {cmd: "I'm feeling a bit down", delay: 3000},
    ]
  },
  {
    name: "Full Demo Flow",
    desc: "Complete workflow walkthrough",
    steps: [
      {cmd: "hey Lilly!", delay: 2000},
      {cmd: "what do you sense around us?", delay: 3000},
      {cmd: "open the camera", delay: 3000},
      {cmd: "what do you see?", delay: 4000},
      {cmd: "where can I find a good pho place?", delay: 3000},
      {cmd: "what notifications do I have?", delay: 3000},
      {cmd: "tell me a joke", delay: 3000},
      {cmd: "what time is it?", delay: 2000},
      {cmd: "good night Lilly", delay: 3000},
    ]
  },
];

let running = false;
let currentScenario = -1;

function init() {
  const list = document.getElementById('scenarioList');
  list.innerHTML = SCENARIOS.map((s, i) =>
    `<div class="scenario" onclick="selectScenario(${i})" id="sc${i}">
      <div class="name">${s.name}</div>
      <div class="desc">${s.desc} (${s.steps.length} steps)</div>
    </div>`
  ).join('');
  selectScenario(0);
}

function selectScenario(i) {
  currentScenario = i;
  document.querySelectorAll('.scenario').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
}

function ts() {
  return new Date().toLocaleTimeString();
}

function log(cls, text) {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

function updateProgress(step, total) {
  const pct = total > 0 ? Math.round((step / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${step}/${total}`;
  document.getElementById('progressLabel').textContent = step >= total ? 'Complete' : `Step ${step + 1}`;
}

async function sendCommand(text) {
  const resp = await fetch(`${API}/api/cmd`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, avatar: 'puppy'})
  });
  return await resp.json();
}

function typeWriter(el, text, speed = 30) {
  return new Promise(resolve => {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.textContent = '|';
    cursor.style.animation = 'blink 0.7s infinite';
    el.appendChild(cursor);
    function tick() {
      if (i < text.length) {
        el.textContent = text.substring(0, i + 1);
        el.appendChild(cursor);
        i++;
        setTimeout(tick, speed + Math.random() * 20);
      } else {
        cursor.remove();
        resolve();
      }
    }
    tick();
  });
}

async function runScenario() {
  if (currentScenario < 0 || running) return;
  running = true;
  const scenario = SCENARIOS[currentScenario];
  document.getElementById('runBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('statusText').textContent = `Running: ${scenario.name}`;
  document.getElementById('statusText').className = 'status running';

  clearLog();
  log('info', `[${ts()}] Starting scenario: ${scenario.name}`);
  log('info', `[${ts()}] ${scenario.steps.length} steps`);
  log('divider', '<hr>');

  updateProgress(0, scenario.steps.length);

  for (let i = 0; i < scenario.steps.length; i++) {
    if (!running) break;
    const step = scenario.steps[i];

    const cmdDiv = document.createElement('div');
    cmdDiv.className = 'cmd';
    document.getElementById('log').appendChild(cmdDiv);
    await typeWriter(cmdDiv, `> ${step.cmd}`, 35);

    log('info', `[${ts()}] Sending...`);

    try {
      const result = await sendCommand(step.cmd);
      if (!running) break;

      log('reply', `[${ts()}] ${result.reply || '(no reply)'}`);
      if (result.audio_id) {
        log('ok', `[${ts()}] Audio ready (id: ${result.audio_id})`);
      }
      log('divider', '<hr>');
    } catch(e) {
      log('err', `[${ts()}] Error: ${e.message}`);
      log('divider', '<hr>');
    }

    updateProgress(i + 1, scenario.steps.length);

    if (i < scenario.steps.length - 1 && running) {
      await new Promise(r => setTimeout(r, step.delay || 2000));
    }
  }

  running = false;
  document.getElementById('runBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('statusText').textContent = running ? 'Stopped' : 'Complete';
  document.getElementById('statusText').className = 'status';
  log('ok', `[${ts()}] Scenario complete.`);
}

function stopScenario() {
  running = false;
  document.getElementById('statusText').textContent = 'Stopped';
  document.getElementById('statusText').className = 'status';
  document.getElementById('runBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
  log('err', `[${ts()}] Stopped by user.`);
}

init();
</script>
<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}</style>
</body>
</html>
